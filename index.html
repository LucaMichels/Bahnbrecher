<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bahnbrecher">
<title>Bahnbrecher</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
html{height:100%;overflow:hidden;background:#14161B;overscroll-behavior:none}
body{margin:0;background:#14161B;overscroll-behavior:none}
/* iPhone: App füllt den ganzen Bildschirm; --st = zusätzlicher Abstand oben, wenn die Statusleiste höher als 42 px ist (Dynamic Island) */
:root{--st:max(0px,calc(env(safe-area-inset-top) - 42px));--sb:env(safe-area-inset-bottom)}
#app{height:100vh;height:100dvh} /* kein position:fixed – iOS verschiebt dort die Tippflächen */
*{box-sizing:border-box}
.btn{appearance:none;border:0;border-radius:14px;min-height:52px;padding:0 20px;font:700 16px 'DM Sans',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.primary{background:#E8A33D;color:#1A1408}
.ghost{background:transparent;color:#F1EFEA;border:1px solid rgba(255,255,255,.2)}
.soft{background:#2A2E37;color:#F1EFEA}
.btn:disabled{opacity:.35;cursor:default}
.sm{min-height:44px;font-size:15px;border-radius:12px;padding:0 16px}
.card{background:#1E2128;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.h{font-family:'Archivo',system-ui,sans-serif;font-weight:800;margin:0;letter-spacing:.005em}
.muted{color:#A3A8B2}
.eyebrow{font:700 12px 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#E8A33D;margin:0}
.lbl{font-size:13px;color:#A3A8B2;display:flex;flex-direction:column;gap:6px}
.inp{height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#1E2128;color:#F1EFEA;padding:0 14px;font:16px 'DM Sans',sans-serif;width:100%}
.inp:focus{outline:2px solid #E8A33D;outline-offset:1px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 16px 'Archivo',sans-serif;color:#14161B;flex:none}
.chip{appearance:none;border:1px solid rgba(255,255,255,.18);background:transparent;color:#F1EFEA;border-radius:999px;min-height:44px;padding:0 16px;font:500 15px 'DM Sans',sans-serif;cursor:pointer}
.iconbtn{appearance:none;border:0;background:#1E2128;color:#F1EFEA;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.layer{position:absolute;inset:0;background:#14161B;z-index:20;display:flex;flex-direction:column}
.layerhead{padding:calc(54px + var(--st)) 16px 10px;display:flex;align-items:center;gap:12px}
.layerbody{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:8px 20px 36px;display:flex;flex-direction:column;gap:14px}
.layerbody>*,.scroller>*{flex-shrink:0;max-width:100%;min-width:0}
.layerbody,.scroller,.sheet,.layer{overflow-x:hidden !important;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-y}
.layerbody::-webkit-scrollbar,.scroller::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}
.li,.card{min-width:0}
.li>div{min-width:0}
.scroller{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:#1E2128;border-radius:26px 26px 0 0;padding:22px 20px max(34px,calc(var(--sb) + 20px));display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column;background:#1E2128;border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06);min-height:56px}
.li:last-child{border-bottom:0}
.libtn{appearance:none;border:0;background:transparent;color:#F1EFEA;font:inherit;text-align:left;width:100%;cursor:pointer}
.libtn:disabled{cursor:default;opacity:.45}
.sw{appearance:none;border:0;width:52px;height:32px;border-radius:999px;position:relative;cursor:pointer;flex:none;padding:0}
.knob{position:absolute;top:3px;width:26px;height:26px;border-radius:50%;background:#FFFFFF;transition:left .15s}
.tab{appearance:none;border:0;background:transparent;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px 'DM Sans',sans-serif;cursor:pointer;padding:10px 0 0;min-height:56px}
.seg{display:flex;background:#1E2128;border-radius:14px;padding:4px;gap:4px}
.segbtn{appearance:none;border:0;flex:1;min-height:40px;border-radius:10px;font:700 14px 'DM Sans',sans-serif;cursor:pointer}
.stat{font:800 28px 'Archivo',sans-serif;margin:0}
.badge{font:700 12px 'DM Sans',sans-serif;border-radius:999px;padding:5px 10px;white-space:nowrap}
.key{appearance:none;border:0;background:#1E2128;color:#F1EFEA;height:64px;border-radius:16px;font:700 24px 'Archivo',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.textbtn{appearance:none;border:0;background:transparent;color:#E8A33D;font:700 15px 'DM Sans',sans-serif;cursor:pointer;padding:10px 4px;min-height:44px}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; max-width: 520px; height: 100%; margin: 0 auto; position: relative; overflow: hidden; background: #14161B; color: #F1EFEA; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.4;">

<!-- ============ WILLKOMMEN ============ -->
<sc-if value="{{scr.welcome}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: calc(110px + var(--st)) 28px 48px;">
  <div style="display: flex; flex-direction: column; gap: 22px;">
    <div style="width: 76px; height: 76px; border-radius: 22px; background: #E8A33D; display: flex; align-items: center; justify-content: center;">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1A1408" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1.6 0 2.5 1.3 2.5 2.8 0 1.2-.6 2-1 2.7-.3.6-.2 1.2.3 2 .9 1.4 2.2 3.4 2.2 6.3 0 3.3-1.6 6.2-4 6.2s-4-2.9-4-6.2c0-2.9 1.3-4.9 2.2-6.3.5-.8.6-1.4.3-2-.4-.7-1-1.5-1-2.7C9.5 3.3 10.4 2 12 2z"></path><path d="M10.2 8.4h3.6"></path></svg>
    </div>
    <h1 class="h" style="font-size: 44px; line-height: 1; text-transform: uppercase; letter-spacing: .02em;">Bahn&#173;brecher</h1>
    <p class="muted" style="margin: 0; font-size: 17px; max-width: 300px;">Strafen, Termine, Spiele und Reisekasse – alles für euren Kegelverein an einem Ort.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <button class="btn primary" onClick="{{goLogin}}">Anmelden</button>
    <button class="btn ghost" onClick="{{goRegister}}">Verein registrieren</button>
  </div>
</div>
</sc-if>

<!-- ============ LOGIN ============ -->
<sc-if value="{{scr.login}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(54px + var(--st)) 20px 40px; gap: 24px;">
  <button class="iconbtn" aria-label="Zurück" onClick="{{goWelcome}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 class="h" style="font-size: 32px;">Anmelden</h1>
    <p class="muted" style="margin: 0;">Alle Mitglieder nutzen die Zugangsdaten eures Vereins. Danach meldest du dich mit deiner persönlichen PIN an.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px;">
    <label class="lbl">Vereins-E-Mail<input class="inp" type="email" value="{{login.email}}" onChange="{{onLoginEmail}}"></label>
    <label class="lbl">Passwort<input class="inp" type="password" value="{{login.pw}}" onChange="{{onLoginPw}}"></label>
    <button class="textbtn" style="align-self: flex-start;" onClick="{{forgot}}">Passwort vergessen?</button>
  </div>
  <div style="flex: 1;"></div>
  <button class="btn primary" onClick="{{doLogin}}">Weiter</button>
</div>
</sc-if>

<!-- ============ REGISTRIEREN ============ -->
<sc-if value="{{scr.register}}" hint-placeholder-val="{{false}}">
<div class="scroller" style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(54px + var(--st)) 20px 36px; gap: 18px; overflow-y: auto;">
  <button class="iconbtn" aria-label="Zurück" onClick="{{goWelcome}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 class="h" style="font-size: 32px;">Verein registrieren</h1>
    <p class="muted" style="margin: 0;">Ein Account für den ganzen Verein. Mitglieder und Strafregeln richtet ihr danach ein.</p>
  </div>
  <label class="lbl">Vereinsname<input class="inp" type="text" value="{{reg.name}}" onChange="{{regName}}" placeholder="z. B. Bahnbrecher"></label>
  <label class="lbl">Ort<input class="inp" type="text" value="{{reg.ort}}" onChange="{{regOrt}}" placeholder="[Ort]"></label>
  <label class="lbl">Vereins-E-Mail<input class="inp" type="email" value="{{reg.email}}" onChange="{{regEmail}}" placeholder="verein@beispiel.de"></label>
  <label class="lbl">Passwort<input class="inp" type="password" value="{{reg.pw}}" onChange="{{regPw}}"></label>
  <label class="lbl">Admin-PIN (4–6 Ziffern)<input class="inp" type="password" inputmode="numeric" value="{{reg.pin}}" onChange="{{regPin}}"></label>
  <p class="muted" style="margin: 0; font-size: 13px;">Mit der PIN ändert ihr später alle Vereinseinstellungen. Nur der Admin sollte sie kennen.</p>
  <button class="btn primary" disabled="{{regDisabled}}" onClick="{{doRegister}}">Verein anlegen</button>
</div>
</sc-if>

<!-- ============ PROFILWAHL ============ -->
<sc-if value="{{scr.profile}}" hint-placeholder-val="{{false}}">
<div class="scroller" style="overflow-y: auto; position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(86px + var(--st)) 20px 40px; gap: 24px;">
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <p class="eyebrow">{{clubName}}</p>
    <h1 class="h" style="font-size: 32px;">Wer bist du?</h1>
    <p class="muted" style="margin: 0;">Wähle dein Profil und bestätige mit deiner PIN. Beim ersten Mal legst du sie fest.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
    <sc-for list="{{mem}}" as="m" hint-placeholder-count="8">
      <button class="libtn" style="background: #1E2128; border-radius: 18px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px;" onClick="{{m.pick}}">
        <span class="av" style="width: 52px; height: 52px; font-size: 18px; background: {{m.color}};">{{m.initial}}</span>
        <span style="font-weight: 700;">{{m.name}}</span>
        <span class="muted" style="font-size: 11px; line-height: 1.2; text-align: center; min-height: 13px;">{{m.roleShort}}</span>
        <span style="font-size: 11px; line-height: 1.2; text-align: center; min-height: 13px; color: #E8A33D;">{{m.pinHint}}</span>
      </button>
    </sc-for>
  </div>
</div>
</sc-if>

<!-- ============ PERSÖNLICHE PIN ============ -->
<sc-if value="{{scr.mpin}}" hint-placeholder-val="{{false}}">
<div class="scroller" style="overflow-y: auto; position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(54px + var(--st)) 20px 32px;">
  <button class="iconbtn" aria-label="Zurück zur Profilwahl" onClick="{{mpBack}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  <div style="flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; padding-top: 4px; gap: 16px;">
    <span class="av" style="width: 64px; height: 64px; font-size: 22px; background: {{mp.color}};">{{mp.initial}}</span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
      <h1 class="h" style="font-size: 26px;">{{mp.title}}</h1>
      <p class="muted" style="margin: 0; font-size: 14px; max-width: 290px;">{{mp.sub}}</p>
    </div>
    <div style="display: flex; gap: 14px; height: 18px;" aria-live="polite">
      <sc-for list="{{mpinDots}}" as="d" hint-placeholder-count="4">
        <span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #E8A33D; background: {{d.bg}};"></span>
      </sc-for>
    </div>
    <p style="margin: 0; min-height: 20px; font-size: 14px; text-align: center; color: {{mp.msgColor}};" role="status">{{mp.msg}}</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 300px; margin-top: auto;">
      <sc-for list="{{mkeys}}" as="k" hint-placeholder-count="12">
        <sc-if value="{{k.isNum}}" hint-placeholder-val="{{true}}"><button class="key" onClick="{{k.press}}">{{k.label}}</button></sc-if>
        <sc-if value="{{k.isBlank}}" hint-placeholder-val="{{false}}"><span></span></sc-if>
        <sc-if value="{{k.isDel}}" hint-placeholder-val="{{false}}"><button class="key" style="background: transparent;" aria-label="Löschen" onClick="{{k.press}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg></button></sc-if>
      </sc-for>
    </div>
    <div style="min-height: 44px;">
      <sc-if value="{{mp.canForgot}}" hint-placeholder-val="{{true}}">
        <button class="textbtn" onClick="{{mpForgot}}">PIN vergessen?</button>
      </sc-if>
    </div>
  </div>
</div>
</sc-if>

<!-- ============ APP ============ -->
<sc-if value="{{scr.app}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0;">

  <!-- Kopfzeile -->
  <div style="position: absolute; top: 0; left: 0; right: 0; padding: calc(54px + var(--st)) 20px 12px; display: flex; align-items: flex-end; gap: 12px; background: #14161B; z-index: 5;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <p class="eyebrow">{{clubName}}</p>
      <h1 class="h" style="font-size: 30px;">{{title}}</h1>
    </div>
    <sc-if value="{{admin}}" hint-placeholder-val="{{false}}">
      <span class="badge" style="background: #E8A33D; color: #1A1408; margin-bottom: 8px;">Admin</span>
    </sc-if>
    <button class="iconbtn" aria-label="Verein und Verwaltung" onClick="{{openVerein}}">
      <span class="av" style="width: 34px; height: 34px; font-size: 14px; background: {{me.color}};">{{me.initial}}</span>
    </button>
  </div>

  <!-- Inhalt -->
  <div class="scroller" style="position: absolute; top: calc(120px + var(--st)); bottom: max(84px, calc(50px + var(--sb))); left: 0; right: 0; overflow-y: auto; padding: 4px 20px 28px; display: flex; flex-direction: column; gap: 14px;">

    <!-- START -->
    <sc-if value="{{t.start}}" hint-placeholder-val="{{true}}">
      <p style="margin: 0; font-size: 17px;">Hallo {{me.name}}, schön dass du da bist.</p>
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <p class="eyebrow">Nächster Termin</p>
          <span class="badge" style="background: {{next.badgeBg}}; color: {{next.badgeFg}};">{{next.badge}}</span>
        </div>
        <div>
          <h2 class="h" style="font-size: 24px;">{{next.title}} · {{next.label}}</h2>
          <p class="muted" style="margin: 4px 0 0;">{{next.time}} Uhr · {{next.place}}</p>
        </div>
        <p style="margin: 0; font-size: 14px;"><b>{{next.nYes}}</b> zugesagt · <b>{{next.nNo}}</b> abgesagt · <b>{{next.nOpen}}</b> offen</p>
        <sc-if value="{{next.myOpen}}" hint-placeholder-val="{{true}}">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
            <button class="btn primary sm" onClick="{{next.yes}}">Zusagen</button>
            <button class="btn soft sm" onClick="{{next.no}}">Absagen</button>
          </div>
          <p class="muted" style="margin: 0; font-size: 13px;">{{next.deadline}}</p>
        </sc-if>
        <sc-if value="{{next.myYes}}" hint-placeholder-val="{{false}}">
          <button class="btn soft sm" onClick="{{next.no}}">Doch absagen</button>
        </sc-if>
        <sc-if value="{{next.myNo}}" hint-placeholder-val="{{false}}">
          <p style="margin: 0; font-size: 14px;">Dein Grund: {{next.myReason}}</p>
          <button class="btn soft sm" onClick="{{next.yes}}">Doch zusagen</button>
        </sc-if>
      </div>
      <sc-if value="{{showKonto}}" hint-placeholder-val="{{true}}">
        <button class="libtn card" style="flex-direction: row; align-items: center;" onClick="{{openKonto}}">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
            <p class="eyebrow">Vereinskonto · berechnet</p>
            <span class="stat" style="font-size: 32px;">{{konto.balanceLabel}}</span>
            <span class="muted" style="font-size: 13px;">seit Abgleich am {{konto.anchorDate}}</span>
          </div>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3A8B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </sc-if>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <button class="libtn card" style="gap: 4px;" onClick="{{openKasseMe}}">
          <span class="muted" style="font-size: 13px;">Deine offenen Strafen</span>
          <span class="stat">{{myOpen}}</span>
          <span style="color: #E8A33D; font-size: 13px; font-weight: 700;">Details ›</span>
        </button>
        <button class="libtn card" style="gap: 4px;" onClick="{{openKasse}}">
          <span class="muted" style="font-size: 13px;">Vereinskasse offen</span>
          <span class="stat">{{totalOpen}}</span>
          <span style="color: #E8A33D; font-size: 13px; font-weight: 700;">Wer schuldet was ›</span>
        </button>
      </div>
      <button class="btn primary" onClick="{{goTab.strafen}}">Strafe erfassen</button>
      <button class="libtn card" style="flex-direction: row; align-items: center;" onClick="{{goTab.ausgaben}}">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <p class="eyebrow">Reisekasse</p>
          <span style="font-weight: 700; font-size: 17px;">{{groupName}}</span>
          <span style="color: {{myBalColor}};">{{myBalLabel}}</span>
        </div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A3A8B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </sc-if>

    <!-- STRAFEN -->
    <sc-if value="{{t.strafen}}" hint-placeholder-val="{{false}}">
      <div class="seg" role="tablist">
        <button class="segbtn" style="background: {{segE.bg}}; color: {{segE.fg}};" onClick="{{showErfassen}}">Erfassen</button>
        <button class="segbtn" style="background: {{segU.bg}}; color: {{segU.fg}};" onClick="{{showUebersicht}}">Übersicht</button>
      </div>

      <sc-if value="{{sv.erfassen}}" hint-placeholder-val="{{true}}">
        <sc-if value="{{finesLocked}}" hint-placeholder-val="{{false}}">
          <div class="card">
            <div style="display: flex; gap: 10px; align-items: center;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
              <h2 class="h" style="font-size: 18px;">Für Mitglieder gesperrt</h2>
            </div>
            <p class="muted" style="margin: 0;">Strafen erfasst bei euch nur der Admin. Freigeben lässt sich das unter Verwaltung › Mitgliederrechte.</p>
          </div>
        </sc-if>
        <sc-if value="{{finesOpen}}" hint-placeholder-val="{{true}}">
          <p class="muted" style="margin: 0; font-size: 14px;">1. {{selLabel}}</p>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{grid}}" as="g" hint-placeholder-count="8">
              <button class="libtn" aria-pressed="{{g.on}}" style="border: 2px solid {{g.bd}}; background: {{g.bg}}; border-radius: 16px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px;" onClick="{{g.toggle}}">
                <span class="av" style="background: {{g.color}};">{{g.initial}}</span>
                <span style="font-size: 13px; font-weight: 500;">{{g.name}}</span>
              </button>
            </sc-for>
          </div>
          <p class="muted" style="margin: 6px 0 0; font-size: 14px;">2. Strafe antippen</p>
          <sc-for list="{{ruleGroups}}" as="grp" hint-placeholder-count="3">
            <p class="eyebrow" style="margin-top: 4px;">{{grp.cat}}</p>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
              <sc-for list="{{grp.items}}" as="r" hint-placeholder-count="4">
                <button class="libtn" style="background: #1E2128; border-radius: 16px; padding: 12px 14px; min-height: 72px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;" onClick="{{r.tap}}">
                  <span style="font-weight: 700; font-size: 14px; line-height: 1.25;">{{r.name}}</span>
                  <span style="color: #E8A33D; font-weight: 700; font-size: 14px;">{{r.amountLabel}}</span>
                </button>
              </sc-for>
            </div>
          </sc-for>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <button class="libtn" style="border: 1px dashed rgba(255,255,255,.22); border-radius: 16px; padding: 12px 14px; min-height: 72px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;" onClick="{{openFree}}">
              <span style="font-weight: 700; font-size: 14px;">Freie Strafe</span>
              <span class="muted" style="font-size: 13px;">eigener Betrag</span>
            </button>
          </div>
        </sc-if>
        <h2 class="h" style="font-size: 18px; margin-top: 8px;">Zuletzt erfasst</h2>
        <div class="list">
          <sc-for list="{{recent}}" as="f" hint-placeholder-count="5">
            <div class="li">
              <span class="av" style="width: 34px; height: 34px; font-size: 14px; background: {{f.color}};">{{f.initial}}</span>
              <div style="flex: 1; display: flex; flex-direction: column;">
                <span style="font-weight: 700;">{{f.who}}</span>
                <span class="muted" style="font-size: 13px;">{{f.name}} · {{f.date}}</span>
              </div>
              <span style="font-weight: 700;">{{f.amountLabel}}</span>
              <sc-if value="{{f.canDel}}" hint-placeholder-val="{{false}}">
                <button class="iconbtn" style="background: transparent; width: 36px;" aria-label="Strafe löschen" onClick="{{f.del}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4A49A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{sv.uebersicht}}" hint-placeholder-val="{{false}}">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <div class="card" style="gap: 4px;"><p class="muted" style="margin: 0; font-size: 13px;">Offen</p><p class="stat">{{totalOpen}}</p></div>
          <div class="card" style="gap: 4px;"><p class="muted" style="margin: 0; font-size: 13px;">Bezahlt</p><p class="stat">{{totalPaid}}</p></div>
        </div>
        <sc-if value="{{onlyMine}}" hint-placeholder-val="{{false}}">
          <p class="muted" style="margin: 0; font-size: 13px;">Du siehst nur deine eigenen Strafen. Der Admin hat „Strafen aller sehen“ ausgeschaltet.</p>
        </sc-if>
        <div class="list">
          <sc-for list="{{sums}}" as="s" hint-placeholder-count="8">
            <div class="li">
              <span class="av" style="width: 34px; height: 34px; font-size: 14px; background: {{s.color}};">{{s.initial}}</span>
              <div style="flex: 1; display: flex; flex-direction: column;">
                <span style="font-weight: 700;">{{s.nameLabel}}</span>
                <span class="muted" style="font-size: 13px;">{{s.countLabel}}</span>
              </div>
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                <span style="font-weight: 700;">{{s.openLabel}}</span>
                <sc-if value="{{s.canPay}}" hint-placeholder-val="{{false}}">
                  <button class="textbtn" style="padding: 0; min-height: 28px; font-size: 13px;" onClick="{{s.pay}}">bezahlt</button>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </sc-if>

    <!-- TERMINE -->
    <sc-if value="{{t.termine}}" hint-placeholder-val="{{false}}">
      <sc-for list="{{evs}}" as="e" hint-placeholder-count="3">
        <div class="card">
          <div style="display: flex; gap: 14px; align-items: center;">
            <div style="width: 58px; height: 58px; border-radius: 14px; background: #2A2E37; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none;">
              <span class="muted" style="font-size: 12px; font-weight: 700;">{{e.wd}}</span>
              <span class="h" style="font-size: 20px;">{{e.day}}</span>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-weight: 700; font-size: 17px;">{{e.title}}</span>
              <span class="muted" style="font-size: 13px;">{{e.time}} Uhr · {{e.place}}</span>
            </div>
            <span class="badge" style="background: {{e.badgeBg}}; color: {{e.badgeFg}};">{{e.badge}}</span>
          </div>
          <p style="margin: 0; font-size: 14px;"><b>{{e.nYes}}</b> zugesagt · <b>{{e.nNo}}</b> abgesagt · <b>{{e.nOpen}}</b> offen</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
            <sc-if value="{{e.myYes}}" hint-placeholder-val="{{false}}"><button class="btn soft sm" onClick="{{e.no}}">Absagen</button></sc-if>
            <sc-if value="{{e.notYes}}" hint-placeholder-val="{{true}}"><button class="btn primary sm" onClick="{{e.yes}}">Zusagen</button></sc-if>
            <button class="btn ghost sm" onClick="{{e.detail}}">Wer kommt?</button>
          </div>
          <sc-if value="{{e.myOpen}}" hint-placeholder-val="{{false}}">
            <button class="textbtn" style="align-self: flex-start; padding: 0;" onClick="{{e.no}}">Ich kann nicht – absagen</button>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{admin}}" hint-placeholder-val="{{false}}">
        <button class="btn ghost" onClick="{{newEvent}}">Termin anlegen</button>
      </sc-if>
    </sc-if>

    <!-- SPIELE -->
    <sc-if value="{{t.spiele}}" hint-placeholder-val="{{false}}">
      <div class="card">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <h2 class="h" style="font-size: 18px; flex: 1;">Wer spielt mit?</h2>
          <button class="textbtn" style="padding: 0 6px;" onClick="{{playersAll}}">Alle</button>
          <button class="textbtn" style="padding: 0 6px;" onClick="{{playersNone}}">Keine</button>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{playerChips}}" as="p" hint-placeholder-count="11">
            <button class="chip" style="background: {{p.bg}}; color: {{p.fg}}; border-color: {{p.bd}};" aria-pressed="{{p.on}}" onClick="{{p.toggle}}">{{p.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px;">
          <input id="gast-name" class="inp" style="flex: 1; min-width: 0; height: 44px;" type="text" aria-label="Name des Gastes" value="{{guestName}}" onChange="{{onGuestName}}" placeholder="Gast hinzufügen">
          <button class="btn soft sm" disabled="{{guestDisabled}}" onClick="{{addGuest}}">Hinzufügen</button>
        </div>
        <p class="muted" style="margin: 0; font-size: 13px;">{{playersLabel}}</p>
      </div>
      <button class="libtn card" style="background: #E8A33D; color: #1A1408;" disabled="{{gamesDisabled}}" onClick="{{openParty}}">
        <p class="eyebrow" style="color: #1A1408;">Partyspiel</p>
        <span class="h" style="font-size: 26px;">Party-Karten</span>
        <span style="font-size: 14px;">Aufgaben, Regeln und Abstimmungen mit euren Namen.</span>
      </button>
      <button class="libtn card" disabled="{{gamesDisabled}}" onClick="{{openWheel}}">
        <p class="eyebrow">Zufall</p>
        <span class="h" style="font-size: 22px;">Glücksrad</span>
        <span class="muted" style="font-size: 14px;">Wer zahlt die nächste Runde?</span>
      </button>
      <div class="list">
        <sc-for list="{{soon}}" as="g" hint-placeholder-count="4">
          <div class="li">
            <div style="flex: 1; display: flex; flex-direction: column;">
              <span style="font-weight: 700;">{{g.name}}</span>
              <span class="muted" style="font-size: 13px;">{{g.desc}}</span>
            </div>
            <span class="badge" style="background: #2A2E37; color: #A3A8B2;">Bald</span>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <!-- AUSGABEN -->
    <sc-if value="{{t.ausgaben}}" hint-placeholder-val="{{false}}">
      <div class="card">
        <p class="eyebrow">Gruppe · Basiswährung EUR</p>
        <h2 class="h" style="font-size: 24px;">{{groupName}}</h2>
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span class="muted">Gesamt</span><span class="stat" style="font-size: 24px;">{{expTotal}}</span>
        </div>
        <span style="color: {{myBalColor}}; font-weight: 700;">{{myBalLabel}}</span>
      </div>
      <sc-if value="{{canAddExp}}" hint-placeholder-val="{{true}}">
        <button class="btn primary" onClick="{{openAddExp}}">Ausgabe hinzufügen</button>
      </sc-if>

      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px;">
        <h2 class="h" style="font-size: 18px;">So gleicht ihr aus</h2>
        <span class="muted" style="font-size: 13px;">{{trCompare}}</span>
      </div>
      <div class="list">
        <sc-for list="{{transfers}}" as="x" hint-placeholder-count="3">
          <div class="li">
            <div style="flex: 1; display: flex; flex-direction: column;">
              <span style="font-weight: 700; text-decoration: {{x.deco}};">{{x.fromName}} → {{x.toName}}</span>
              <span style="color: #E8A33D; font-weight: 700;">{{x.amountLabel}}</span>
            </div>
            <button class="chip" style="background: {{x.bg}}; color: {{x.fg}}; border-color: {{x.bd}};" aria-pressed="{{x.done}}" onClick="{{x.toggle}}">{{x.label}}</button>
          </div>
        </sc-for>
        <sc-if value="{{allSettled}}" hint-placeholder-val="{{false}}">
          <div class="li"><span class="muted">Alles ausgeglichen.</span></div>
        </sc-if>
      </div>

      <h2 class="h" style="font-size: 18px; margin-top: 6px;">Salden</h2>
      <div class="list">
        <sc-for list="{{balances}}" as="b" hint-placeholder-count="5">
          <div class="li">
            <span class="av" style="width: 34px; height: 34px; font-size: 14px; background: {{b.color}};">{{b.initial}}</span>
            <span style="flex: 1; font-weight: 700;">{{b.nameLabel}}</span>
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
              <span style="font-weight: 700; color: {{b.fg}};">{{b.label}}</span>
              <span class="muted" style="font-size: 12px;">{{b.sub}}</span>
            </div>
          </div>
        </sc-for>
      </div>

      <h2 class="h" style="font-size: 18px; margin-top: 6px;">Ausgaben</h2>
      <div class="list">
        <sc-for list="{{expList}}" as="x" hint-placeholder-count="4">
          <div class="li">
            <div style="flex: 1; display: flex; flex-direction: column;">
              <span style="font-weight: 700;">{{x.desc}}</span>
              <span class="muted" style="font-size: 13px;">{{x.payerName}} hat bezahlt · für {{x.amongLabel}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
              <span style="font-weight: 700;">{{x.orig}}</span>
              <sc-if value="{{x.isForeign}}" hint-placeholder-val="{{false}}"><span class="muted" style="font-size: 12px;">{{x.conv}}</span></sc-if>
            </div>
          </div>
        </sc-for>
      </div>
      <p class="muted" style="margin: 0; font-size: 12px;">Kurs pro Ausgabe gespeichert. Prototyp: Beispielziel Prag, Kurs 1 EUR = {{rate}} CZK.</p>
    </sc-if>
  </div>

  <!-- Tab-Leiste -->
  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: max(84px, calc(50px + var(--sb))); background: #191B21; border-top: 1px solid rgba(255,255,255,.06); display: flex; padding: 0 6px; z-index: 6;" aria-label="Hauptnavigation">
    <button class="tab" style="color: {{tc.start}};" onClick="{{goTab.start}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20.5h-5.5v-6h-6v6H3.5z"></path></svg>Start</button>
    <button class="tab" style="color: {{tc.strafen}};" onClick="{{goTab.strafen}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M14.6 9.3c-.6-.8-1.5-1.3-2.6-1.3-1.6 0-2.9 1-2.9 2.3 0 3 5.7 1.6 5.7 4.4 0 1.3-1.3 2.3-2.9 2.3-1.1 0-2.1-.5-2.7-1.3M12 6.5V8m0 9v1.5"></path></svg>Strafen</button>
    <button class="tab" style="color: {{tc.termine}};" onClick="{{goTab.termine}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Termine</button>
    <button class="tab" style="color: {{tc.spiele}};" onClick="{{goTab.spiele}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"></rect><circle cx="9" cy="9" r="1.3" fill="currentColor"></circle><circle cx="15" cy="9" r="1.3" fill="currentColor"></circle><circle cx="9" cy="15" r="1.3" fill="currentColor"></circle><circle cx="15" cy="15" r="1.3" fill="currentColor"></circle></svg>Spiele</button>
    <button class="tab" style="color: {{tc.ausgaben}};" onClick="{{goTab.ausgaben}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V7a2 2 0 0 1 2-2h11v3"></path><rect x="4" y="8" width="16" height="11.5" rx="2.5"></rect><circle cx="16" cy="13.75" r="1.3" fill="currentColor"></circle></svg>Ausgaben</button>
  </nav>
</div>
</sc-if>

<!-- ============ TERMIN ANLEGEN ============ -->
<sc-if value="{{o.evnew}}" hint-placeholder-val="{{false}}">
<div class="layer">
  <div class="layerhead">
    <button class="iconbtn" aria-label="Schließen" onClick="{{closeEvForm}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    <span class="h" style="font-size: 22px;">Termin anlegen</span>
  </div>
  <div class="layerbody">
    <label class="lbl">Titel<input class="inp" type="text" value="{{evf.title}}" onChange="{{efTitle}}" placeholder="z. B. Kegelabend"></label>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{titleChips}}" as="c" hint-placeholder-count="4">
        <button class="chip" style="background: {{c.bg}}; color: {{c.fg}}; border-color: {{c.bd}};" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
      </sc-for>
    </div>
    <label class="lbl">Ort<input class="inp" type="text" value="{{evf.place}}" onChange="{{efPlace}}" placeholder="z. B. Zur Schanze, Büren"></label>
    <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px;">
      <label class="lbl">Erster Termin<input class="inp" style="color-scheme: dark;" type="date" value="{{evf.date}}" onChange="{{efDate}}"></label>
      <label class="lbl">Uhrzeit<input class="inp" style="color-scheme: dark;" type="time" value="{{evf.time}}" onChange="{{efTime}}"></label>
    </div>

    <h2 class="h" style="font-size: 17px; margin-top: 6px;">Wiederholung</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{freqChips}}" as="c" hint-placeholder-count="4">
        <button class="chip" style="background: {{c.bg}}; color: {{c.fg}}; border-color: {{c.bd}};" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
      </sc-for>
    </div>
    <sc-if value="{{evx.rep}}" hint-placeholder-val="{{true}}">
      <div class="li" style="background: #1E2128; border-radius: 16px; border-bottom: 0;">
        <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">Alle</span><span class="muted" style="font-size: 12px;">{{evx.weekText}}</span></div>
        <button class="iconbtn" style="background: #2A2E37;" aria-label="Rhythmus verkürzen" onClick="{{ivMinus}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <span class="h" style="font-size: 17px; min-width: 92px; text-align: center;">{{evx.ivText}}</span>
        <button class="iconbtn" style="background: #2A2E37;" aria-label="Rhythmus verlängern" onClick="{{ivPlus}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </sc-if>
    <sc-if value="{{evx.month}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{monthChips}}" as="c" hint-placeholder-count="2">
          <button class="chip" style="background: {{c.bg}}; color: {{c.fg}}; border-color: {{c.bd}};" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{evx.rep}}" hint-placeholder-val="{{true}}">
      <h2 class="h" style="font-size: 17px; margin-top: 6px;">Ende der Serie</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{endChips}}" as="c" hint-placeholder-count="2">
          <button class="chip" style="background: {{c.bg}}; color: {{c.fg}}; border-color: {{c.bd}};" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
        </sc-for>
      </div>
      <sc-if value="{{evx.endCount}}" hint-placeholder-val="{{true}}">
        <div class="li" style="background: #1E2128; border-radius: 16px; border-bottom: 0;">
          <span style="flex: 1; font-weight: 500;">Nach</span>
          <button class="iconbtn" style="background: #2A2E37;" aria-label="Weniger Termine" onClick="{{cntMinus}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <span class="h" style="font-size: 17px; min-width: 92px; text-align: center;">{{evx.countText}}</span>
          <button class="iconbtn" style="background: #2A2E37;" aria-label="Mehr Termine" onClick="{{cntPlus}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
      </sc-if>
      <sc-if value="{{evx.endDate}}" hint-placeholder-val="{{false}}">
        <label class="lbl">Letzter möglicher Termin<input class="inp" style="color-scheme: dark;" type="date" value="{{evf.until}}" onChange="{{efUntil}}"></label>
      </sc-if>
    </sc-if>

    <h2 class="h" style="font-size: 17px; margin-top: 6px;">Abmeldefrist</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <sc-for list="{{fristChips}}" as="c" hint-placeholder-count="3">
        <button class="chip" style="background: {{c.bg}}; color: {{c.fg}}; border-color: {{c.bd}};" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
      </sc-for>
    </div>

    <div class="card" style="margin-top: 6px;">
      <p class="eyebrow">Vorschau</p>
      <p style="margin: 0; font-weight: 700;">{{evx.summary}}</p>
      <div class="list" style="background: #14161B;">
        <sc-for list="{{evPrev}}" as="p" hint-placeholder-count="4">
          <div class="li" style="min-height: 44px;"><span style="flex: 1;">{{p.label}}</span><span class="muted" style="font-size: 12px;">{{p.note}}</span></div>
        </sc-for>
      </div>
      <span class="muted" style="font-size: 13px;">{{evMore}}</span>
    </div>
    <button class="btn primary" disabled="{{evDisabled}}" onClick="{{saveEv}}">{{evSaveLabel}}</button>
  </div>
</div>
</sc-if>

<!-- ============ TERMIN-DETAIL ============ -->
<sc-if value="{{showEvent}}" hint-placeholder-val="{{false}}">
<div class="layer">
  <div class="layerhead">
    <button class="iconbtn" aria-label="Zurück" onClick="{{closeEvent}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="display: flex; flex-direction: column;">
      <span class="h" style="font-size: 20px;">{{evd.title}} · {{evd.label}}</span>
      <span class="muted" style="font-size: 13px;">{{evd.time}} Uhr · {{evd.place}}</span>
    </div>
  </div>
  <div class="layerbody">
    <h2 class="h" style="font-size: 17px;">Zugesagt ({{evd.nYes}})</h2>
    <div class="list">
      <sc-for list="{{evd.yesL}}" as="m" hint-placeholder-count="4">
        <div class="li"><span class="av" style="width: 32px; height: 32px; font-size: 13px; background: {{m.color}};">{{m.initial}}</span><span style="font-weight: 500;">{{m.nameLabel}}</span></div>
      </sc-for>
    </div>
    <h2 class="h" style="font-size: 17px;">Abgesagt ({{evd.nNo}})</h2>
    <sc-if value="{{evd.hideReasons}}" hint-placeholder-val="{{false}}">
      <p class="muted" style="margin: 0; font-size: 13px;">Abmeldegründe sind nur für den Admin sichtbar.</p>
    </sc-if>
    <div class="list">
      <sc-for list="{{evd.noL}}" as="m" hint-placeholder-count="2">
        <div class="li"><span class="av" style="width: 32px; height: 32px; font-size: 13px; background: {{m.color}};">{{m.initial}}</span><span style="flex: 1; font-weight: 500;">{{m.nameLabel}}</span><span class="muted" style="font-size: 13px;">{{m.reason}}</span></div>
      </sc-for>
    </div>
    <h2 class="h" style="font-size: 17px;">Noch offen ({{evd.nOpen}})</h2>
    <div class="list">
      <sc-for list="{{evd.openL}}" as="m" hint-placeholder-count="2">
        <div class="li"><span class="av" style="width: 32px; height: 32px; font-size: 13px; background: {{m.color}};">{{m.initial}}</span><span style="font-weight: 500;">{{m.nameLabel}}</span></div>
      </sc-for>
    </div>
    <sc-if value="{{evd.showAtt}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px;">
        <h2 class="h" style="font-size: 17px;">Anwesenheit am Abend</h2>
        <p class="muted" style="margin: 0; font-size: 13px;">Abhaken, wer wirklich da war. {{evd.attCount}}</p>
      </div>
      <div class="list">
        <sc-for list="{{evd.attL}}" as="a" hint-placeholder-count="8">
          <div class="li">
            <span class="av" style="width: 32px; height: 32px; font-size: 13px; background: {{a.color}};">{{a.initial}}</span>
            <span style="flex: 1; font-weight: 500;">{{a.name}}</span>
            <button class="chip" style="min-height: 38px; padding: 0 12px; background: {{a.daBg}}; color: {{a.daFg}}; border-color: {{a.daBd}};" aria-pressed="{{a.isDa}}" onClick="{{a.da}}">Da</button>
            <button class="chip" style="min-height: 38px; padding: 0 12px; background: {{a.feBg}}; color: {{a.feFg}}; border-color: {{a.feBd}};" aria-pressed="{{a.isFe}}" onClick="{{a.fehlt}}">Fehlt</button>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</sc-if>

<!-- ============ VEREINSKASSE ============ -->
<sc-if value="{{o.kasse}}" hint-placeholder-val="{{false}}">
<div class="layer">
  <div class="layerhead">
    <button class="iconbtn" aria-label="Zurück" onClick="{{closeOverlay}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <span class="h" style="font-size: 22px;">Vereinskasse</span>
  </div>
  <div class="layerbody">
    <sc-if value="{{showKonto}}" hint-placeholder-val="{{true}}">
      <div class="seg">
        <button class="segbtn" style="background: {{kvK.bg}}; color: {{kvK.fg}};" onClick="{{showKontoView}}">Konto</button>
        <button class="segbtn" style="background: {{kvS.bg}}; color: {{kvS.fg}};" onClick="{{showStrafenView}}">Offene Strafen</button>
      </div>
    </sc-if>

    <sc-if value="{{kv.konto}}" hint-placeholder-val="{{false}}">
      <div class="card" style="gap: 4px;">
        <p class="eyebrow">Kontostand · berechnet</p>
        <span class="stat" style="font-size: 36px;">{{konto.balanceLabel}}</span>
      </div>
      <div class="list">
        <div class="li"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">Abgeglichener Stand</span><span class="muted" style="font-size: 13px;">am {{konto.anchorDate}}</span></div><span style="font-weight: 700;">{{konto.anchorLabel}}</span></div>
        <div class="li"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">+ Monatsbeiträge</span><span class="muted" style="font-size: 13px;">{{konto.beitragSub}}</span></div><span style="font-weight: 700; color: #93DAAA;">{{konto.beitragLabel}}</span></div>
        <div class="li"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">+ Bezahlte Strafen</span><span class="muted" style="font-size: 13px;">{{konto.finesSub}}</span></div><span style="font-weight: 700; color: #93DAAA;">{{konto.finesLabel}}</span></div>
        <div class="li"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">− Gaststätte</span><span class="muted" style="font-size: 13px;">{{konto.gastroSub}}</span></div><span style="font-weight: 700; color: #F6AFA5;">{{konto.gastroLabel}}</span></div>
        <sc-if value="{{konto.kasseExp}}" hint-placeholder-val="{{false}}"><div class="li"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 500;">− Ausgaben aus der Kegelkasse</span><span class="muted" style="font-size: 13px;">{{konto.kasseExpSub}}</span></div><span style="font-weight: 700; color: #F6AFA5;">{{konto.kasseExpLabel}}</span></div></sc-if>
        <div class="li" style="background: #2A2E37;"><span class="h" style="flex: 1; font-size: 17px;">= Kontostand</span><span class="h" style="font-size: 17px;">{{konto.balanceLabel}}</span></div>
      </div>
      <p class="muted" style="margin: 0; font-size: 13px;">Angenommen: Alle Beiträge sind eingegangen. Noch offene Strafen ({{totalOpen}}) sind nicht enthalten.</p>

      <h2 class="h" style="font-size: 18px; margin-top: 6px;">Zahlungen an die Gaststätte</h2>
      <p class="muted" style="margin: -6px 0 0; font-size: 13px;">Pro Kegelabend vom Gemeinschaftskonto bezahlt.</p>
      <div class="list">
        <sc-for list="{{gastroList}}" as="g" hint-placeholder-count="3">
          <div class="li">
            <div style="flex: 1; display: flex; flex-direction: column;">
              <span style="font-weight: 500;">{{g.label}}</span>
              <span class="muted" style="font-size: 13px;">Zur Schanze</span>
            </div>
            <sc-if value="{{g.editable}}" hint-placeholder-val="{{false}}">
              <label style="display: flex; align-items: center; gap: 6px;"><span class="muted" style="font-size: 13px;">€</span><input class="inp" style="width: 100px; height: 44px; text-align: right;" type="text" inputmode="decimal" aria-label="Betrag Gaststätte {{g.date}}" value="{{g.amount}}" onChange="{{g.onAmt}}" placeholder="0,00"></label>
            </sc-if>
            <sc-if value="{{g.readonly}}" hint-placeholder-val="{{true}}">
              <span style="font-weight: 700;">{{g.amountLabel}}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{canKasse}}" hint-placeholder-val="{{false}}">
        <button class="btn ghost sm" onClick="{{addGastro}}">Zahlung für heutigen Kegelabend eintragen</button>
      </sc-if>

      <h2 class="h" style="font-size: 18px; margin-top: 6px;">Monatsbeiträge</h2>
      <div class="list">
        <sc-for list="{{beitragList}}" as="b" hint-placeholder-count="11">
          <div class="li" style="min-height: 48px;">
            <span class="av" style="width: 30px; height: 30px; font-size: 11px; background: {{b.color}};">{{b.initial}}</span>
            <span style="flex: 1; font-weight: 500;">{{b.full}}</span>
            <span style="font-size: 12px; color: {{b.tagColor}};">{{b.tag}}</span>
            <span style="font-weight: 700; min-width: 70px; text-align: right;">{{b.amountLabel}}</span>
          </div>
        </sc-for>
        <div class="li" style="background: #2A2E37;"><div style="flex: 1; display: flex; flex-direction: column;"><span class="h" style="font-size: 16px;">Monatlich gesamt</span><span class="muted" style="font-size: 13px;">{{konto.beitragInfo}}</span></div><span class="h" style="font-size: 16px;">{{konto.monthlyLabel}}</span></div>
      </div>
      <button class="btn soft sm" onClick="{{openBeitraege}}">{{beitragBtn}}</button>
      <sc-if value="{{canKasse}}" hint-placeholder-val="{{false}}">
        <button class="btn ghost sm" onClick="{{openAbgleich}}">Mit echtem Kontostand abgleichen</button>
      </sc-if>
    </sc-if>

    <sc-if value="{{kv.strafen}}" hint-placeholder-val="{{true}}">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div class="card" style="gap: 4px;"><p class="muted" style="margin: 0; font-size: 13px;">Offen</p><p class="stat">{{totalOpen}}</p></div>
      <div class="card" style="gap: 4px;"><p class="muted" style="margin: 0; font-size: 13px;">Bezahlt</p><p class="stat">{{totalPaid}}</p></div>
    </div>
    <p class="muted" style="margin: 0; font-size: 13px;">{{kasseHint}}</p>
    <div class="list">
      <sc-for list="{{kasseList}}" as="k" hint-placeholder-count="8">
        <div style="border-bottom: 1px solid rgba(255,255,255,.06);">
          <button class="libtn li" style="border-bottom: 0;" aria-expanded="{{k.expanded}}" onClick="{{k.toggle}}">
            <span class="av" style="width: 34px; height: 34px; font-size: 13px; background: {{k.color}};">{{k.initial}}</span>
            <div style="flex: 1; display: flex; flex-direction: column;">
              <span style="font-weight: 700;">{{k.nameLabel}}</span>
              <span class="muted" style="font-size: 13px;">{{k.sub}}</span>
            </div>
            <span style="font-weight: 700; color: {{k.fg}};">{{k.openLabel}}</span>
            <span style="color: #A3A8B2; font-size: 18px; width: 14px; text-align: center;">{{k.chev}}</span>
          </button>
          <sc-if value="{{k.expanded}}" hint-placeholder-val="{{false}}">
            <div style="padding: 0 16px 14px 62px; display: flex; flex-direction: column; gap: 12px;">
              <sc-for list="{{k.groups}}" as="g" hint-placeholder-count="2">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  <div style="display: flex; justify-content: space-between;">
                    <span class="eyebrow" style="font-size: 11px;">{{g.label}}</span>
                    <span style="font-size: 13px; font-weight: 700;">{{g.sumLabel}}</span>
                  </div>
                  <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
                    <div style="display: flex; justify-content: space-between; font-size: 14px;">
                      <span class="muted">{{it.name}}</span><span>{{it.amountLabel}}</span>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
              <sc-if value="{{k.none}}" hint-placeholder-val="{{false}}"><span class="muted" style="font-size: 14px;">Keine offenen Strafen.</span></sc-if>
              <sc-if value="{{k.canPay}}" hint-placeholder-val="{{false}}">
                <button class="btn soft sm" onClick="{{k.pay}}">Alles als bezahlt markieren</button>
              </sc-if>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
    </sc-if>
  </div>
</div>
</sc-if>

<!-- ============ BEITRÄGE ============ -->
<sc-if value="{{o.beitraege}}" hint-placeholder-val="{{false}}">
<div class="layer">
  <div class="layerhead">
    <button class="iconbtn" aria-label="Zurück" onClick="{{backFromBeitraege}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <span class="h" style="font-size: 22px;">Monatsbeiträge</span>
  </div>
  <div class="layerbody">
    <div class="card">
      <label class="lbl">Standardbeitrag pro Monat in €<input class="inp" type="text" inputmode="decimal" value="{{beitragStd}}" onChange="{{onBeitragStd}}"></label>
      <p class="muted" style="margin: 0; font-size: 13px;">Laut Satzung §4: 15 € pro Monat. Änderungen beschließt die Mitgliederversammlung.</p>
    </div>
    <h2 class="h" style="font-size: 17px;">Pro Mitglied</h2>
    <p class="muted" style="margin: -6px 0 0; font-size: 13px;">Leer lassen = Standardbeitrag. Abweichende Beträge trägst du hier ein.</p>
    <div class="list">
      <sc-for list="{{beitragList}}" as="b" hint-placeholder-count="11">
        <div class="li">
          <span class="av" style="width: 32px; height: 32px; font-size: 12px; background: {{b.color}};">{{b.initial}}</span>
          <div style="flex: 1; display: flex; flex-direction: column;">
            <span style="font-weight: 500;">{{b.full}}</span>
            <span style="font-size: 12px; color: {{b.tagColor}};">{{b.tag}}</span>
          </div>
          <input class="inp" style="width: 92px; height: 44px; text-align: right;" type="text" inputmode="decimal" aria-label="Beitrag {{b.full}}" value="{{b.value}}" placeholder="{{b.placeholder}}" onChange="{{b.onChange}}">
        </div>
      </sc-for>
      <div class="li" style="background: #2A2E37;"><span class="h" style="flex: 1; font-size: 16px;">Monatlich gesamt</span><span class="h" style="font-size: 16px;">{{konto.monthlyLabel}}</span></div>
    </div>
  </div>
</div>
</sc-if>

<!-- ============ ABGLEICH ============ -->
<sc-if value="{{showAbgleich}}" hint-placeholder-val="{{false}}">
<div class="scrim">
  <div class="sheet">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 class="h" style="font-size: 22px; flex: 1;">Kontostand abgleichen</h2>
      <button class="iconbtn" style="background: #2A2E37;" aria-label="Abbrechen" onClick="{{closeAbgleich}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>
    <p class="muted" style="margin: 0; font-size: 14px;">Trag den echten Stand laut Banking-App ein. Ab heute rechnet die App von diesem Betrag aus weiter.</p>
    <label class="lbl">Kontostand heute in €<input class="inp" type="text" inputmode="decimal" value="{{abgleichVal}}" onChange="{{onAbgleich}}" placeholder="{{konto.balancePlain}}"></label>
    <p class="muted" style="margin: 0; font-size: 13px;">{{abgleichDiff}}</p>
    <button class="btn primary" disabled="{{abgleichDisabled}}" onClick="{{saveAbgleich}}">Abgleichen</button>
  </div>
</div>
</sc-if>

<!-- ============ VEREIN ============ -->
<sc-if value="{{o.verein}}" hint-placeholder-val="{{false}}">
<div class="layer">
  <div class="layerhead">
    <button class="iconbtn" aria-label="Schließen" onClick="{{closeOverlay}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    <span class="h" style="font-size: 22px;">Verein</span>
  </div>
  <div class="layerbody">
    <div class="card" style="flex-direction: row; align-items: center; gap: 14px;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: #E8A33D; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1A1408" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1.6 0 2.5 1.3 2.5 2.8 0 1.2-.6 2-1 2.7-.3.6-.2 1.2.3 2 .9 1.4 2.2 3.4 2.2 6.3 0 3.3-1.6 6.2-4 6.2s-4-2.9-4-6.2c0-2.9 1.3-4.9 2.2-6.3.5-.8.6-1.4.3-2-.4-.7-1-1.5-1-2.7C9.5 3.3 10.4 2 12 2z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column;">
        <span class="h" style="font-size: 20px;">{{clubName}}</span>
        <span class="muted" style="font-size: 14px;">{{memberCount}} Mitglieder · angemeldet als {{me.name}}</span>
      </div>
    </div>
    <div class="list">
      <button class="libtn li" onClick="{{switchProfile}}"><span style="flex: 1; font-weight: 500;">Profil wechseln</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      <sc-if value="{{memberRules}}" hint-placeholder-val="{{false}}">
        <button class="libtn li" onClick="{{openRules}}"><span style="flex: 1; font-weight: 500;">Strafregeln</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </sc-if>
      <button class="libtn li" onClick="{{openAdminOrPin}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <span style="flex: 1; font-weight: 500;">Verwaltung</span>
        <span class="muted" style="font-size: 13px;">{{adminHint}}</span>
      </button>
    </div>
    <h2 class="h" style="font-size: 17px; margin-top: 4px;">Ämter</h2>
    <div class="list">
      <sc-for list="{{officers}}" as="m" hint-placeholder-count="8">
        <div class="li">
          <span class="av" style="width: 32px; height: 32px; font-size: 12px; background: {{m.color}};">{{m.initial}}</span>
          <span style="flex: 1; font-weight: 500;">{{m.full}}</span>
          <span class="muted" style="font-size: 13px; text-align: right; max-width: 150px;">{{m.role}}</span>
        </div>
      </sc-for>
    </div>
    <p class="muted" style="margin: 0; font-size: 12px;">Laut Protokoll der Mitgliederversammlung vom 06.08.2025.</p>
    <button class="btn ghost" onClick="{{logout}}">Abmelden</button>
  </div>
</div>
</sc-if>

<!-- ============ PIN ============ -->
<sc-if value="{{o.pin}}" hint-placeholder-val="{{false}}">
<div class="layer">
  <div class="layerhead">
    <button class="iconbtn" aria-label="Zurück" onClick="{{backToVerein}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 28px 40px; gap: 18px;">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#E8A33D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <h1 class="h" style="font-size: 26px;">Admin-PIN eingeben</h1>
    <div style="display: flex; gap: 14px; height: 18px;" aria-live="polite">
      <sc-for list="{{pinDots}}" as="d" hint-placeholder-count="4">
        <span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid #E8A33D; background: {{d.bg}};"></span>
      </sc-for>
    </div>
    <p style="margin: 0; min-height: 20px; font-size: 14px; color: {{pinMsgColor}};">{{pinMsg}}</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 300px; margin-top: auto;">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <sc-if value="{{k.isNum}}" hint-placeholder-val="{{true}}"><button class="key" onClick="{{k.press}}">{{k.label}}</button></sc-if>
        <sc-if value="{{k.isBlank}}" hint-placeholder-val="{{false}}"><span></span></sc-if>
        <sc-if value="{{k.isDel}}" hint-placeholder-val="{{false}}"><button class="key" style="background: transparent;" aria-label="Löschen" onClick="{{k.press}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg></button></sc-if>
      </sc-for>
    </div>
  </div>
</div>
</sc-if>

<!-- ============ VERWALTUNG ============ -->
<sc-if value="{{o.admin}}" hint-placeholder-val="{{false}}">
<div class="layer">
  <div class="layerhead">
    <button class="iconbtn" aria-label="Zurück" onClick="{{backToVerein}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <span class="h" style="font-size: 22px;">Verwaltung</span>
    <span class="badge" style="background: #E8A33D; color: #1A1408; margin-left: auto;">Admin</span>
  </div>
  <div class="layerbody">
    <p class="muted" style="margin: 0; font-size: 13px;">Der Admin-Modus endet nach 10 Minuten ohne Aktivität.</p>
    <div class="list">
      <button class="libtn li" onClick="{{openRights}}"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 700;">Mitgliederrechte</span><span class="muted" style="font-size: 13px;">Was Standard-Mitglieder dürfen</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button class="libtn li" onClick="{{openPins}}"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 700;">Mitglieder-PINs</span><span class="muted" style="font-size: 13px;">{{pinSetLabel}}</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button class="libtn li" onClick="{{openBeitraegeAdmin}}"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 700;">Beiträge &amp; Konto</span><span class="muted" style="font-size: 13px;">{{konto.monthlyLabel}} pro Monat</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      <button class="libtn li" onClick="{{openRules}}"><div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 700;">Strafregeln &amp; Katalog</span><span class="muted" style="font-size: 13px;">{{rulesCount}} aktive Regeln</span></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8B2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>

      soon: [

        { name: 'Ich hab noch nie …', desc: 'Aussagen, wer es doch getan hat, reagiert' },

      kv: { konto: kvKonto, strafen: !kvKonto }, kvK: kvKonto ? segOn : segOff, kvS: kvKonto ? segOff : segOn,
      showKontoView: () => set({ kasseView: 'konto' }), showStrafenView: () => set({ kasseView: 'strafen' }),
      addGastro: () => { if (this.state.gastro.some(g => g.date === 'heute')) { this.showToast('Für heute ist schon ein Eintrag da'); return; }
        set({ gastro: this.state.gastro.concat([{ id: 'g' + Date.now(), date: 'heute', amount: '' }]) }); },
      openBeitraege: () => set(this.state.admin ? { overlay: 'beitraege', beitragFrom: 'kasse' } : { overlay: 'pin', pin: '', pinErr: false, pinTarget: 'beitraege', beitragFrom: 'kasse' }),
      openBeitraegeAdmin: () => set({ overlay: 'beitraege', beitragFrom: 'admin' }),
      beitragBtn: st.admin ? 'Beiträge anpassen' : 'Beiträge anpassen (Admin-PIN)',
      backFromBeitraege: () => set({ overlay: this.state.beitragFrom === 'admin' ? 'admin' : 'kasse', kasseView: 'konto' }),
      beitragStd: st.beitragStd, onBeitragStd: (e) => { var v = e.target.value; this.setState({ beitragStd: v }); },
      showAbgleich: abV !== null, abgleichVal: abV || '', abgleichDiff: abDiff, abgleichDisabled: abNum === null,
      openAbgleich: () => set({ abgleich: '' }), closeAbgleich: () => set({ abgleich: null }),
      onAbgleich: (e) => { var v = e.target.value; this.setState({ abgleich: v }); },
      saveAbgleich: () => { if (abNum === null) return;
        set({ anchor: { date: '10.10.2026', key: '1010', amount: abNum, months: 0 }, abgleich: null,
          fines: this.state.fines.map(f => f.paid ? Object.assign({}, f, { paidOn: 'alt' }) : f),
          gastro: this.state.gastro.map(g => g.date === 'heute' ? Object.assign({}, g, { date: '10.10.' }) : g) });
        this.showToast('Kontostand auf ' + fmt(abNum) + ' abgeglichen'); }, expTotal: fmt(total), myBalLabel: myBalLabel, myBalColor: myBalColor, rate: RATE,
      transfers: transfers, allSettled: transfers.length === 0, balances: balances, expList: expList,
      trCompare: rawCount + ' → ' + transfers.length + ' Zahlungen',
      canAddExp: can('expenses'), groupSize: GROUP.length,
      openAddExp: () => set({ expForm: { desc: '', amount: '', cur: 'EUR', payer: this.state.me, among: GROUP.slice() } }),
      splitChips: splitChips, splitLabel: splitLabel, splitCount: nSplit + ' von ' + GROUP.length, efKasse: efKasse, efSplit: !efKasse,
      splitAll: () => set({ expForm: Object.assign({}, this.state.expForm, { among: GROUP.slice() }) }),
      splitNone: () => set({ expForm: Object.assign({}, this.state.expForm, { among: [] }) }),
      showAddExp: !!st.expForm, ef: ef, closeAddExp: () => set({ expForm: null }),
      efDesc: this.field('expForm', 'desc'), efAmount: this.field('expForm', 'amount'),
      curChips: curChips, payerChips: payerChips, efPreview: efPreview, efDisabled: !efOk,
      saveExp: () => { if (!efOk) return;
        set({ exp: this.state.exp.concat([{ id: 'x' + Date.now(), desc: ef.desc.trim(), amount: efA, cur: ef.cur, payer: ef.payer, among: efKasse ? GROUP.slice() : ef.among.slice(),
          date: pad(new Date().getDate()) + '.' + pad(new Date().getMonth() + 1) + '.' }]), expForm: null });
        this.showToast('Ausgabe gespeichert'); },

      o: o, openVerein: () => set({ overlay: 'verein' }), closeOverlay: () => set({ overlay: null }),
      switchProfile: () => set({ overlay: null, screen: 'profile', sel: [] }),

      backToVerein: () => set({ overlay: this.state.pinTarget ? 'kasse' : 'verein', pin: '', pinTarget: null }), backToAdmin: () => set({ overlay: 'admin' }),
      backFromRules: () => set({ overlay: this.state.admin ? 'admin' : 'verein' }),
      pinDots: pinDots, keys: keys,
      mpinDots: mpinDots, mkeys: mkeys, mp: mp, mpBack: () => set({ screen: 'profile', mpin: null }),
      mpForgot: () => this.showToast('Sag dem Admin Bescheid – er setzt deine PIN unter Verwaltung › Mitglieder-PINs zurück.'),
      pinList: pinList, pinSetLabel: pinSetN + ' von ' + MEMBERS.length + ' festgelegt', openPins: () => set({ overlay: 'pins' }),
      pinMsg: st.pinErr ? 'Falsche PIN – bitte erneut versuchen' : (st.adminPin === '1234' ? 'Demo-PIN: 1234' : 'PIN aus der Registrierung'),

      openRights: () => set({ overlay: 'rights' }), openRules: () => set({ overlay: 'rules' }), openCatalog: () => set({ overlay: 'catalog' }),
      rightsList: rightsList, rulesAll: rulesAll, rulesCount: rulesActive.length, catalog: catalog, catalogCount: catalog.length, catalogEmpty: catalog.length === 0,

        set({ rules: this.state.rules.concat([{ id: 'r' + Date.now(), name: nr.name.trim(), amount: am, cat: 'Eigene', adopted: true, active: true }]), newRule: { name: '', amount: '' } });
        this.showToast('Regel „' + nr.name.trim() + '“ angelegt'); },

      hasToast: !!st.toast, toast: st.toast, toastUndo: st.toastUndo

}
mountApp(Component);
// iPhone: Nach dem Schließen der Tastatur bleibt die Seite sonst verschoben,
// dann passen die Tippflächen nicht mehr zum Bild – Seite wieder nach oben setzen.
(function () {
  var typing = () => /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
  var reset = () => { if (!typing() && (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop)) window.scrollTo(0, 0); };
  document.addEventListener('focusout', () => setTimeout(reset, 60));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => setTimeout(reset, 60));
  window.addEventListener('scroll', reset);
})();
</script>
